<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fute da firma</title>
<meta name="description" content="Gestão do futebol da firma — cadastro, mensalidades, caixa, presença, notas e sorteio de times.">
<meta property="og:title" content="Fute da firma">
<meta property="og:description" content="Gestão do futebol da firma.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tarcisiogb.github.io/fute-da-firma/">
<meta property="og:image" content="https://tarcisiogb.github.io/fute-da-firma/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Fute da firma">
<meta name="twitter:description" content="Gestão do futebol da firma.">
<meta name="twitter:image" content="https://tarcisiogb.github.io/fute-da-firma/og-image.png">
<meta name="theme-color" content="#14532d">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pitch:#14532d; --grass:#1f7a44; --grass-deep:#166534; --paper:#f4f6f2; --ink:#10221a;
  --ink-soft:#5c6b62; --line:#e2e8e2; --grass-soft:#e9f3ec; --amber:#b9852b; --amber-soft:#fbf1dd;
  --star:#e6a935; --red:#b23a2e; --red-soft:#fbe9e7; --blue:#3b5bdb; --shadow:0 10px 30px rgba(16,40,28,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2.5px solid var(--grass);outline-offset:2px;border-radius:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
img{max-width:100%}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 80px}
.wrap.auth{max-width:460px}

header.top{display:flex;align-items:center;gap:12px;padding:20px 4px 4px}
.crest{flex:0 0 auto;width:44px;height:auto}
.crest.big{width:76px}
.brand{font-family:'Archivo',sans-serif;font-weight:900;letter-spacing:-.02em;line-height:.92;color:var(--ink)}
.brand .fw{font-size:24px;display:block}
.brand .hl{color:var(--grass)}
.userchip{margin-left:auto;display:flex;align-items:center;gap:10px}
.userav{width:38px;height:38px;border-radius:11px;background:var(--grass-soft);color:var(--grass-deep);font-family:'Archivo',sans-serif;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;flex:0 0 auto}
.userchip .who{text-align:right;line-height:1.1}
.userchip .who b{font-size:14px;font-weight:700;display:block}
.userchip .who span{font-size:11px;color:var(--ink-soft)}
.chalkline{height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 22px);margin:14px 4px 18px;border-radius:2px}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.badge.master{background:var(--pitch);color:#fff}
.badge.adm{background:var(--grass-soft);color:var(--grass-deep)}
.badge.mens{background:var(--grass);color:#fff}
.badge.semcob{background:#eef1ee;color:var(--ink-soft)}
.badge.pend{background:var(--amber-soft);color:var(--amber)}
.badge.inativo{background:var(--red-soft);color:var(--red)}
.badge.pos{background:var(--grass-soft);color:var(--grass-deep);font-weight:700}
.badge.pos2{background:#fff;border:1px solid var(--line);color:var(--ink-soft);font-weight:600}
.badge.google{background:#eef2ff;color:var(--blue)}

nav.tabs{display:flex;gap:6px;overflow-x:auto;margin:4px 0 18px;padding-bottom:4px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:#fff;border:1px solid var(--line);color:var(--ink-soft);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .15s ease}
nav.tabs button:hover:not(:disabled){color:var(--grass-deep);border-color:var(--grass)}
nav.tabs button.on{background:var(--pitch);color:#fff;border-color:var(--pitch)}

.panel{background:#fff;border-radius:16px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:16px}
.panel.pitch{background:var(--pitch);color:#fff;border:none;background-image:radial-gradient(130% 120% at 100% 0%, #1c6a3a 0%, var(--pitch) 62%)}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--grass-deep);margin-bottom:6px}
.panel.pitch .eyebrow{color:#8fd3a8}
h2.ph{font-family:'Archivo',sans-serif;font-weight:800;font-size:21px;margin-bottom:4px;letter-spacing:-.01em}
.muted{color:var(--ink-soft);font-size:13px;line-height:1.5}
.panel.pitch .muted{color:#c7e6d1}

.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.01em}
.field input,.selin{width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--line);border-radius:11px;background:#fbfcfb;color:var(--ink);font-family:inherit}
.field input:focus,.selin:focus{border-color:var(--grass);background:#fff;outline:none}
.field .sub{font-size:11.5px;color:var(--ink-soft);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.poschips{display:flex;flex-wrap:wrap;gap:8px}
.poschip{font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;cursor:pointer;background:#fff;border:1px solid var(--line);color:var(--ink-soft);user-select:none;transition:all .12s ease}
.poschip:hover{border-color:var(--grass)}
.poschip.on{background:var(--grass);border-color:var(--grass);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;font-size:15px;font-weight:700;border-radius:12px;border:none;cursor:pointer;background:var(--grass);color:#fff;transition:filter .15s ease}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.google{background:#fff;color:#3c4043;border:1px solid #dadce0;font-weight:600}
.btn.small{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.btn.mini{width:auto;padding:6px 11px;font-size:12px;font-weight:600;border-radius:9px}
.btn.mini.ghost{color:var(--ink-soft)}
.btn.mini.danger{background:var(--red-soft);color:var(--red)}
.btn.mini.ok{background:var(--grass);color:#fff}
.linkbtn{background:none;border:none;color:var(--grass-deep);font-size:13px;font-weight:600;cursor:pointer;padding:6px 2px;width:auto;text-decoration:underline}
.orsep{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--ink-soft);font-size:12px}
.orsep::before,.orsep::after{content:"";flex:1;height:1px;background:var(--line)}
.seg{display:flex;background:#eef1ee;border-radius:12px;padding:4px;margin-bottom:18px}
.seg button{flex:1;border:none;background:transparent;padding:10px;font-size:14px;font-weight:700;color:var(--ink-soft);border-radius:9px;cursor:pointer;transition:all .15s ease}
.seg button.on{background:#fff;color:var(--pitch);box-shadow:0 2px 6px rgba(16,40,28,.08)}
.formmsg{font-size:13px;font-weight:600;padding:11px 13px;border-radius:11px;margin-bottom:14px;line-height:1.45}
.formmsg.err{background:var(--red-soft);color:var(--red)}
.formmsg.ok{background:var(--grass-soft);color:var(--grass-deep)}
.divider{height:1px;background:var(--line);margin:18px 0}
.subhead{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:12px}

.stars{position:relative;display:inline-block;font-size:16px;line-height:1;letter-spacing:2px;white-space:nowrap;vertical-align:middle}
.stars-bg{color:#d7ded8}
.stars-fg{position:absolute;left:0;top:0;color:var(--star);overflow:hidden;white-space:nowrap}
.stars-num{font-family:'Archivo',sans-serif;font-weight:800;font-size:14px;margin-left:8px;vertical-align:middle;color:var(--ink)}
.panel.pitch .stars-bg{color:rgba(255,255,255,.28)}
.panel.pitch .stars-num{color:#fff}
.starsin{display:flex;gap:8px}
.starin{font-size:34px;line-height:1;cursor:pointer;color:#d7ded8;user-select:none;transition:color .1s ease}
.starin.on{color:var(--star)}

.photoedit{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.photobig{width:82px;height:82px;border-radius:20px;background:var(--grass-soft);color:var(--grass-deep);font-family:'Archivo',sans-serif;font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
.userav img,.photobig img,.pav img,.pfav img{width:100%;height:100%;object-fit:cover;display:block}

.prow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.prow:last-child{border-bottom:none}
.pav{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:var(--grass-soft);color:var(--grass-deep);font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pinfo{flex:1 1 160px;min-width:130px}
.pinfo .pname{font-weight:700;font-size:15px}
.pinfo .pname small{font-weight:500;color:var(--ink-soft);font-size:12.5px}
.pinfo .pmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center}
.submeta{font-size:11.5px;color:var(--ink-soft);margin-top:4px}
.pacts{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.emptymsg{text-align:center;color:var(--ink-soft);font-size:13.5px;padding:22px 8px;line-height:1.5}
.demo-banner{background:var(--amber-soft);border:1px solid #e7cf94;color:#7a5a12;font-size:12.5px;font-weight:600;padding:10px 13px;border-radius:11px;margin:14px 0 0;text-align:center;line-height:1.45}
.warn{background:#fff7ed;border:1px solid #f0cfa0;color:#8a5a1a;font-size:12.5px;font-weight:500;padding:11px 13px;border-radius:11px;margin-bottom:14px;line-height:1.5}
.warn code{background:#f4e3c8;padding:1px 5px;border-radius:4px}

.pfhead{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.pfav{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;font-family:'Archivo',sans-serif;font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
.pfgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.pfcell{background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px}
.pfcell .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8fd3a8;font-weight:700}
.pfcell .v{font-size:15px;font-weight:700;margin-top:3px}

.acc-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.acc-row:last-child{border-bottom:none}
.acc-info{flex:1 1 180px;min-width:150px}
.acc-info .an{font-weight:700;font-size:14.5px}
.acc-info .ad{font-size:12.5px;color:var(--ink-soft);margin-top:2px;font-family:ui-monospace,monospace}
.acc-acts{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}

.caixa-hero{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.caixa-hero .val{font-family:'Archivo',sans-serif;font-weight:900;font-size:32px;letter-spacing:-.01em}
.caixa-hero .val.neg{color:#ffd0c8}
.mesnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mesnav .meslbl{font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;text-transform:capitalize}
.mesnav .btn.mini{font-size:16px;padding:5px 12px}
.tsummary{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tsum{flex:1 1 30%;min-width:0;background:var(--grass-soft);border-radius:12px;padding:12px 8px;text-align:center}
.tsum .k{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--grass-deep);font-weight:700}
.tsum .v{font-family:'Archivo',sans-serif;font-weight:900;font-size:16px;margin-top:3px;color:var(--ink)}
.desp-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.desp-row:last-child{border-bottom:none}
.desp-cat{flex:0 0 auto;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eef2ef;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.02em}
.desp-info{flex:1 1 auto;min-width:0}
.desp-info .dd{font-weight:600;font-size:14px}
.desp-info .dm{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.desp-val{font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;color:var(--red)}

.gacct{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.gacct:hover{border-color:var(--grass)}
.gav{width:38px;height:38px;border-radius:999px;background:var(--grass-soft);color:var(--grass-deep);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto}
.gtxt{display:flex;flex-direction:column}
.gtxt b{font-size:14px}.gtxt span{font-size:12px;color:var(--ink-soft)}

.overlay{position:fixed;inset:0;background:rgba(10,26,18,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:18px;padding:24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{font-family:'Archivo',sans-serif;font-weight:800;font-size:19px;margin-bottom:8px}
.modal p{font-size:14px;color:var(--ink-soft);line-height:1.5;margin-bottom:18px}
.modal input{width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--line);border-radius:11px;margin-bottom:18px}
.modal .row{display:flex;gap:10px}
.modal .row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;padding:12px 20px;border-radius:999px;z-index:120;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .2s ease}
.toast.show{opacity:1}
.hint{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:14px;line-height:1.6}
.hint code{background:#eef1ee;padding:2px 6px;border-radius:5px;font-size:11.5px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.sechead .count{font-size:12px;font-weight:700;color:var(--grass-deep);background:var(--grass-soft);padding:3px 9px;border-radius:999px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1}
.teamcard{background:var(--grass-soft);border-radius:14px;padding:14px;margin-bottom:12px}
.teamhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.teamname{font-family:'Archivo',sans-serif;font-weight:800;font-size:16px;text-transform:capitalize;color:var(--pitch)}
.teammeta{font-size:11.5px;color:var(--ink-soft);font-weight:600}
.teamrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(20,83,45,.08)}
.teampl{flex:1;font-weight:600;font-size:14px}
.teamnota{flex:0 0 auto}
.golstep{display:flex;align-items:center;gap:6px}
.golnum{font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;min-width:36px;text-align:center}
.barrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.barlbl{flex:0 0 96px;font-size:13px;font-weight:600}
.bartrack{flex:1;height:10px;background:var(--grass-soft);border-radius:6px;overflow:hidden}
.barfill{height:100%;background:var(--grass);border-radius:6px}
.barval{flex:0 0 auto;font-family:'Archivo',sans-serif;font-weight:800;font-size:13px}
.sharebox{width:100%;height:190px;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:12.5px;font-family:ui-monospace,monospace;resize:vertical;color:var(--ink);line-height:1.5}
</style>
</head>
<body>

function poolFor(k){
  var j=dbJogo(k), anyPres=false, kk; for(kk in j.presenca){ anyPres=true; break; }
  var all=dbAllPlayers(), pool=[];
  for(var i=0;i<all.length;i++){ var p=all[i]; if(!(p.mensalista&&p.status==="aprovado"&&p.ativo)) continue; var inc=anyPres?(j.presenca[p.id]===true):(j.confirm[p.id]==="sim"); if(inc){ var ni=notaInfo(p); pool.push({id:p.id,nome:p.apelido||p.nome,pos:p.posPrincipal,nota:ni.value,supt:p.supt,area:p.area,isAvulso:false}); } }
  for(var a=0;a<j.avulsos.length;a++){ var b=j.avulsos[a]; pool.push({id:b.id,nome:b.nome,pos:b.posPrincipal,nota:b.nota||3,supt:null,area:null,isAvulso:true}); }

}
function emptyTeams(n){ var t=[]; for(var i=0;i<n;i++) t.push({label:"Time "+(i+1),players:[],soma:0,gk:false}); return t; }
function posCount(team,pos){ var c=0; for(var i=0;i<team.players.length;i++){ if(team.players[i].pos===pos) c++; } return c; }
function drawBalanced(pool,n){
  if(pool.length<n) return {erro:"Poucos jogadores para "+n+" times ("+pool.length+" presentes)."};
  var teams=emptyTeams(n), gks=[], others=[];
  for(var i=0;i<pool.length;i++){ (pool[i].pos==="goleiro"?gks:others).push(pool[i]); }
  gks.sort(function(a,b){return b.nota-a.nota;});
  var ti=0; for(var g=0;g<gks.length;g++){ if(ti<n){ teams[ti].players.push(gks[g]); teams[ti].soma+=gks[g].nota; teams[ti].gk=true; ti++; } else others.push(gks[g]); }
  others.sort(function(a,b){return b.nota-a.nota;});
  for(var o=0;o<others.length;o++){ var pl=others[o], best=-1, bs=null;
    for(var t=0;t<n;t++){ var key=[teams[t].soma, posCount(teams[t],pl.pos), teams[t].players.length];
      if(best<0){ best=t; bs=key; continue; }
      if(key[0]<bs[0]-0.0001 || (Math.abs(key[0]-bs[0])<=0.0001 && (key[1]<bs[1] || (key[1]===bs[1] && key[2]<bs[2])))){ best=t; bs=key; }
    }
    teams[best].players.push(pl); teams[best].soma+=pl.nota;
  }
  return {times:teams};
}
function drawTematico(pool,key){
  var groups={}, order=[], sem=[];
  for(var i=0;i<pool.length;i++){ var v=pool[i][key]; if(v && !pool[i].isAvulso){ if(!groups[v]){ groups[v]=[]; order.push(v); } groups[v].push(pool[i]); } else sem.push(pool[i]); }
  if(order.length<2) return {erro:"Preciso de pelo menos 2 "+(key==="supt"?"supts":"áreas")+" diferentes entre os presentes."};
  var teams=[]; for(var q=0;q<order.length;q++){ var pls=groups[order[q]], soma=0, gk=false; for(var j=0;j<pls.length;j++){ soma+=pls[j].nota; if(pls[j].pos==="goleiro") gk=true; } teams.push({label:order[q],players:pls,soma:soma,gk:gk}); }
  sem.sort(function(a,b){return b.nota-a.nota;});
  for(var s=0;s<sem.length;s++){ var mi=0; for(var t=1;t<teams.length;t++){ if(teams[t].players.length<teams[mi].players.length) mi=t; } teams[mi].players.push(sem[s]); teams[mi].soma+=sem[s].nota; if(sem[s].pos==="goleiro") teams[mi].gk=true; }
  return {times:teams};
}

function frequencia(){ var arr=[],all=dbAllPlayers(); for(var i=0;i<all.length;i++){ if(all[i].status!=="aprovado")continue; var c=statPresenca(all[i].id); if(c>0||all[i].mensalista) arr.push({nome:all[i].apelido||all[i].nome,jogos:c,avulso:false}); } var av={},jr=jogosRealizados(); for(var r=0;r<jr.length;r++){ var a=demoJogos[jr[r]].avulsos; for(var j=0;j<a.length;j++){ av[a[j].nome]=(av[a[j].nome]||0)+1; } } for(var nm in av) arr.push({nome:nm,jogos:av[nm],avulso:true}); arr.sort(function(a,b){return b.jogos-a.jogos;}); return arr; }

/* ===================== FIREBASE (produção) =====================
   Espelha as coleções do Firestore nos mesmos caches usados pelo
   modo demo, para o render continuar síncrono. Escritas vão pro
   Firestore; os listeners re-renderizam quando os dados chegam. */
function fbCatch(){ return function(){}; }
function fbFieldDel(){ return firebase.firestore.FieldValue.delete(); }
function upsertPlayer(p){ for(var i=0;i<demoPlayers.length;i++){ if(demoPlayers[i].id===p.id){ demoPlayers[i]=p; return; } } demoPlayers.push(p); }
function fbAuthErr(e){ var c=(e&&e.code)||""; if(c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found") return "E-mail ou senha incorretos."; if(c==="auth/email-already-in-use") return "Já existe um cadastro com esse e-mail."; if(c==="auth/weak-password") return "A senha precisa ter ao menos 6 caracteres."; if(c==="auth/invalid-email") return "E-mail inválido."; if(c==="auth/too-many-requests") return "Muitas tentativas. Tente de novo em instantes."; if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request") return "Login do Google cancelado."; return (e&&e.message)||"Erro de autenticação."; }
function jogoFieldWrite(k, field, subkey, value){ var ref=db.collection("jogos").doc(k), patch={}; patch[field+"."+subkey]=(value===null||value===undefined)?fbFieldDel():value; ref.update(patch).catch(function(){ var o={}; o[field]={}; if(value!==null&&value!==undefined) o[field][subkey]=value; ref.set(o,{merge:true}).catch(fbCatch()); }); }
function jogoArrWrite(k){ db.collection("jogos").doc(k).set({avulsos:dbJogo(k).avulsos},{merge:true}).catch(fbCatch()); }
function fbAfterAuth(user){
  if(S.registering) return;
  if(!user){ S.sessionId=null; S._subscribed=false; S.view="auth"; render(); return; }
  db.collection("jogadores").doc(user.uid).get().then(function(d){
    if(!d.exists){ initForm({nome:user.displayName||"",email:user.email||""}); S.googleNew=true; S.gUid=user.uid; S.view="auth"; render(); return; }
    var p=d.data(); p.id=user.uid;
    if(p.status==="pendente"){ S.msg={tipo:"err",txt:"Seu cadastro ainda está aguardando aprovação de um administrador."}; auth.signOut(); return; }
    if(p.status==="recusado"){ S.msg={tipo:"err",txt:"Seu cadastro não foi aprovado. Fale com um administrador."}; auth.signOut(); return; }
    if(p.ativo===false){ S.msg={tipo:"err",txt:"Seu acesso está inativo. Fale com um administrador."}; auth.signOut(); return; }
    upsertPlayer(p); S.sessionId=user.uid; S.view="app"; if(!S.appTab) S.appTab="inicio"; S.msg=null; subscribeAll(); render();
  }).catch(function(){ S.msg={tipo:"err",txt:"Erro ao carregar seu cadastro. Recarregue a página."}; render(); });
}
function subscribePublic(){ if(S._subPub) return; S._subPub=true;
  db.collection("areas").onSnapshot(function(qs){ demoAreas=[]; qs.forEach(function(d){ var o=d.data(); o.id=d.id; demoAreas.push(o); }); render(); }, fbCatch());
  db.collection("supts").onSnapshot(function(qs){ demoSupts=[]; qs.forEach(function(d){ var o=d.data(); o.id=d.id; demoSupts.push(o); }); render(); }, fbCatch());
}
function subscribeAll(){ if(S._subscribed) return; S._subscribed=true;
  db.collection("jogadores").onSnapshot(function(qs){ demoPlayers=[]; qs.forEach(function(d){ var o=d.data(); o.id=d.id; demoPlayers.push(o); }); render(); }, fbCatch());
  db.collection("config").doc("app").onSnapshot(function(d){ if(d.exists){ var c=d.data(),k; for(k in c) demoConfig[k]=c[k]; } render(); }, fbCatch());
  db.collection("mensalidades").onSnapshot(function(qs){ demoMensalidades={}; qs.forEach(function(d){ var o=d.data(); if(o.uid&&o.mes) demoMensalidades[o.uid+"|"+o.mes]={pago:o.pago,data:o.data,valor:o.valor}; }); render(); }, fbCatch());
  db.collection("despesas").onSnapshot(function(qs){ demoDespesas=[]; qs.forEach(function(d){ var o=d.data(); o.id=d.id; demoDespesas.push(o); }); render(); }, fbCatch());
  db.collection("avulsos").onSnapshot(function(qs){ demoAvulsos=[]; qs.forEach(function(d){ var o=d.data(); o.id=d.id; demoAvulsos.push(o); }); render(); }, fbCatch());
  db.collection("jogos").onSnapshot(function(qs){ qs.forEach(function(d){ var o=d.data(); var j=dbJogo(d.id); j.presenca=o.presenca||{}; j.gols=o.gols||{}; j.avulsos=o.avulsos||[]; j.encerrado=!!o.encerrado; }); render(); }, fbCatch());
  db.collectionGroup("confirmacoes").onSnapshot(function(qs){ var k; for(k in demoJogos) demoJogos[k].confirm={}; qs.forEach(function(d){ var jk=d.ref.parent.parent.id; dbJogo(jk).confirm[d.id]=d.data().resp; }); render(); }, fbCatch());
  db.collection("avaliacoes").onSnapshot(function(qs){ demoAvaliacoes={}; qs.forEach(function(d){ var o=d.data(); if(o.avaliador&&o.alvo&&o.nota) demoAvaliacoes[o.avaliador+"|"+o.alvo]=o.nota; }); render(); }, fbCatch());
}

function pad2(n){ return (n<10?"0":"")+n; }
function todayKey(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1); }
function todayBR(){ var d=new Date(); return pad2(d.getDate())+"/"+pad2(d.getMonth()+1); }
function shiftMonth(key, delta){ var y=parseInt(key.slice(0,4),10), m=parseInt(key.slice(5,7),10)-1+delta; var d=new Date(y,m,1); return d.getFullYear()+"-"+pad2(d.getMonth()+1); }
function mesLabel(key){ var y=key.slice(0,4), m=parseInt(key.slice(5,7),10)-1; return MESES[m]+" de "+y; }
function formatBRL(n){ n=Number(n)||0; var neg=n<0; n=Math.abs(n); return (neg?"− R$ ":"R$ ")+n.toFixed(2).replace(".",","); }
function brNum(n){ n=Number(n)||0; return n.toFixed(2).replace(".",","); }
function parseBRNum(s){ if(!s) return 0; s=String(s).replace(/[^0-9,.-]/g,"").replace(/\./g,"").replace(",","."); var v=parseFloat(s); return isNaN(v)?0:v; }
function esc(s){ s=(s==null?"":String(s)); return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function initials(nome){ var p=(nome||"?").trim().split(/\s+/); var a=p[0]?p[0][0]:"?"; var b=p.length>1?p[p.length-1][0]:""; return (a+b).toUpperCase(); }
function avatarInner(p){ if(p&&p.foto) return '<img src="'+p.foto+'" alt="">'; return esc(initials(p?p.nome:"?")); }
function posPairBadges(p){ var h='<span class="badge pos">'+esc(posLabel(p.posPrincipal))+'</span>'; if(p.posSecundaria) h+=' <span class="badge pos2">'+esc(posLabel(p.posSecundaria))+' · 2ª</span>'; return h; }
function areaSuptLine(p){ if(!p.area&&!p.supt) return ""; return '<div class="submeta">'+esc(p.area||"—")+' · Supt '+esc(p.supt||"—")+'</div>'; }

function starsDisplay(value, showNum){ var v=Math.max(0,Math.min(5,value||0)), pct=(v/5*100), full="★★★★★"; var h='<span class="stars"><span class="stars-bg">'+full+'</span><span class="stars-fg" style="width:'+pct+'%">'+full+'</span></span>'; if(showNum!==false) h+='<span class="stars-num">'+v.toFixed(1).replace(".",",")+'</span>'; return h; }
function starsInput(value){ var h='<div class="starsin">'; for(var i=1;i<=5;i++){ h+='<span class="starin '+(i<=value?"on":"")+'" data-action="set-star" data-val="'+i+'" role="button" aria-label="'+i+' estrelas">★</span>'; } return h+'</div>'; }

/* Seletor de posições (principal + secundária) usando alvo de estado */
function posPicker(t){
  var h='<div class="field"><label>Posição principal</label><div class="poschips">';
  for(var i=0;i<POS.length;i++){ h+='<div class="poschip'+(t.princ===POS[i][0]?" on":"")+'" data-action="pick-princ" data-pos="'+POS[i][0]+'">'+POS[i][1]+'</div>'; }
  h+='</div></div><div class="field"><label>Posição secundária (opcional)</label><div class="poschips">';
  h+='<div class="poschip'+(!t.sec?" on":"")+'" data-action="pick-sec" data-pos="">Nenhuma</div>';
  for(var j=0;j<POS.length;j++){ if(POS[j][0]===t.princ) continue; h+='<div class="poschip'+(t.sec===POS[j][0]?" on":"")+'" data-action="pick-sec" data-pos="'+POS[j][0]+'">'+POS[j][1]+'</div>'; }
  return h+'</div></div>';

/* Seletor de área/supt (lista aprovada + incluir novo) */
function pickerSelect(kind, items, val, isNew, newName, idNew){
  var label = kind==="area" ? "Área" : "Supt da área";
  var h='<div class="field"><label>'+label+'</label><select class="selin" data-action="'+kind+'-select"><option value="">Selecione…</option>';
  var found=false;
  for(var i=0;i<items.length;i++){ if(items[i].status!=="aprovado") continue; var sel=(!isNew && val===items[i].nome); if(sel) found=true; h+='<option value="'+esc(items[i].nome)+'"'+(sel?" selected":"")+'>'+esc(items[i].nome)+'</option>'; }
  if(val && !found && !isNew){ h+='<option value="'+esc(val)+'" selected>'+esc(val)+' (pendente)</option>'; }
  h+='<option value="__new__"'+(isNew?" selected":"")+'>➕ Incluir '+(kind==="area"?"nova área":"novo supt")+'</option></select>';
  if(isNew){ h+='<input id="'+idNew+'" class="selin" style="margin-top:8px" placeholder="Nome '+(kind==="area"?"da nova área":"do novo supt")+'" value="'+esc(newName||"")+'">'; }

  return h;
}

  var h=['<div class="overlay" data-action="modal-close"><div class="modal" data-stop="1"><h3>Escolha uma conta</h3><p>Simulação do login do Google (modo demo).</p>'];
  for(var i=0;i<accts.length;i++){ var a=accts[i]; h.push('<button class="gacct" data-action="google-pick" data-email="'+esc(a.email)+'" data-nome="'+esc(a.nome)+'"><span class="gav">'+esc(initials(a.nome))+'</span><span class="gtxt"><b>'+esc(a.nome)+'</b><span>'+esc(a.email)+' · '+esc(a.tag)+'</span></span></button>'); }
  h.push('<button class="btn ghost" data-action="modal-close" style="margin-top:6px">Cancelar</button></div></div>');
  document.getElementById("modalHost").innerHTML=h.join("");
}
function handleGoogle(email, nome){ var p=dbGetByEmail(email); if(p){ loginPlayer(p); return; } initForm({nome:nome||"",email:email}); S.googleNew=true; S.msg=null; render(); }

document.addEventListener("click", function(ev){
  var el=ev.target.closest?ev.target.closest("[data-action]"):null; if(!el) return;
  var act=el.getAttribute("data-action"), id=el.getAttribute("data-id");

  if(act==="auth-tab"){ var tb=el.getAttribute("data-tab"); S.authTab=tb; S.forgot=false; S.googleNew=false; S.msg=null; if(tb==="signup"){ initForm(); } render(); return; }
  if(act==="forgot-open"){ S.forgot=true; S.msg=null; render(); return; }
  if(act==="do-forgot"){ doForgot(); return; }
  if(act==="do-login"){ doLogin(); return; }
  if(act==="do-signup"){ doSignup(); return; }
  if(act==="google-open"){ if(FB){ auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); return; } googleChooser(); return; }
  if(act==="google-pick"){ var em=el.getAttribute("data-email"), nm=el.getAttribute("data-nome"); closeModal(); handleGoogle(em,nm); return; }
  if(act==="google-cancel"){ S.googleNew=false; S.form=null; S.msg=null; if(FB&&auth.currentUser) auth.signOut(); render(); return; }
  if(act==="do-google-complete"){ doGoogleComplete(); return; }
  if(act==="logout"){ if(FB){ S.edit=null; S.form=null; S.googleNew=false; S.forgot=false; S.sorteio=null; auth.signOut(); return; } S.sessionId=null; S.view="auth"; S.authTab="login"; S.forgot=false; S.googleNew=false; S.msg=null; S.edit=null; S.form=null; render(); return; }
  if(act==="app-tab"){ S.appTab=el.getAttribute("data-tab"); S.msg=null; if(S.appTab==="cadastro"){ S.edit=null; ensureEdit(); } if(S.appTab==="tesouraria" && !S.tesMes){ S.tesMes=todayKey(); } if(S.appTab==="jogos" && !S.jogoSel){ S.jogoSel=proximoJogoKey(); } render(); return; }

  if(act==="pick-princ"){ syncActiveForm(); var t=formTarget(); t.princ=el.getAttribute("data-pos"); if(t.sec===t.princ) t.sec=""; render(); return; }
  if(act==="pick-sec"){ syncActiveForm(); var t2=formTarget(); t2.sec=el.getAttribute("data-pos"); render(); return; }
  if(act==="set-star"){ syncActiveForm(); var t3=formTarget(); t3.autoavaliacao=parseInt(el.getAttribute("data-val"),10); render(); return; }
  if(act==="pick-foto"){ syncEditInputs(); document.getElementById("fotoInput").click(); return; }
  if(act==="rem-foto"){ syncEditInputs(); if(!S.edit) ensureEdit(); S.edit.foto=null; render(); return; }
  if(act==="save-cadastro"){ saveCadastro(); return; }

  if(act==="approve"){ dbUpdate(id,{status:"aprovado"}); toast("Cadastro aprovado"); render(); return; }
  if(act==="reject"){ var pr=dbGet(id); confirmModal("Recusar cadastro","Recusar o acesso de "+(pr?pr.apelido:"")+"?",function(){ dbUpdate(id,{status:"recusado"}); closeModal(); toast("Cadastro recusado"); render(); },true); return; }
  if(act==="toggle-mens"){ var m=dbGet(id); dbUpdate(id,{mensalista:!m.mensalista}); toast(m.mensalista?"Marcado sem cobrança":"Agora é mensalista"); render(); return; }
  if(act==="toggle-ativo"){ var v=dbGet(id); dbUpdate(id,{ativo:!v.ativo}); toast(v.ativo?"Jogador inativado":"Jogador reativado"); render(); return; }
  if(act==="toggle-adm"){ var g=dbGet(id); var novo=g.role==="adm"?"jogador":"adm"; confirmModal(novo==="adm"?"Conceder Adm":"Remover Adm",(novo==="adm"?"Dar acesso de administrador a ":"Tirar o acesso de administrador de ")+g.apelido+"?",function(){ dbUpdate(id,{role:novo}); closeModal(); toast(novo==="adm"?"Agora é Adm":"Adm removido"); render(); }); return; }

  if(act==="save-cfg"){ dbSetConfig({ valorMensalidade:parseBRNum(val("cfg_valor")), chavePix:val("cfg_pix").trim() }); toast("Valores salvos"); render(); return; }
  if(act==="mes-prev"){ S.tesMes=shiftMonth(S.tesMes,-1); render(); return; }
  if(act==="mes-next"){ S.tesMes=shiftMonth(S.tesMes,1); render(); return; }
  if(act==="toggle-pago"){ var cur=dbMens(id,S.tesMes); var np=!(cur&&cur.pago); dbSetMens(id,S.tesMes, np?{pago:true,data:todayBR(),valor:dbConfig().valorMensalidade}:null); toast(np?"Marcado como pago":"Marcado em aberto"); render(); return; }
  if(act==="copy-pix"){ var cfg=dbConfig(); if(navigator.clipboard&&cfg.chavePix) navigator.clipboard.writeText(cfg.chavePix); toast("Chave PIX copiada"); return; }
  if(act==="add-despesa"){ var vv=parseBRNum(val("desp_valor")); if(vv<=0){ toast("Informe um valor válido"); return; } dbAddDespesa({mesKey:S.tesMes,dataBR:todayBR(),categoria:val("desp_cat"),valor:vv,descricao:val("desp_desc").trim()}); toast("Despesa lançada"); render(); return; }
  if(act==="del-despesa"){ confirmModal("Excluir despesa","Remover esta despesa do caixa?",function(){ dbDelDespesa(id); closeModal(); toast("Despesa removida"); render(); },true); return; }

  // Jogos / presença / avulsos
  if(act==="confirm-sim"){ var u=me(), k=proximoJogoKey(), jp=dbJogoPeek(k), cur=jp?jp.confirm[u.id]:null; setConfirm(u.id,k, cur==="sim"?null:"sim"); toast(cur==="sim"?"Confirmação removida":"Presença confirmada"); render(); return; }
  if(act==="confirm-nao"){ var u2=me(), k2=proximoJogoKey(), jp2=dbJogoPeek(k2), cur2=jp2?jp2.confirm[u2.id]:null; setConfirm(u2.id,k2, cur2==="nao"?null:"nao"); toast(cur2==="nao"?"Resposta removida":"Marcado que não vai"); render(); return; }
  if(act==="save-jogo-cfg"){ dbSetConfig({ diaJogo:parseInt(val("jc_dia"),10), horaJogo:val("jc_hora").trim(), localJogo:val("jc_local").trim() }); S.jogoSel=proximoJogoKey(); toast("Dia do jogo salvo"); render(); return; }
  if(act==="jogo-prev"){ S.jogoSel=shiftJogo(S.jogoSel,-1); S.sorteio=null; render(); return; }
  if(act==="jogo-next"){ S.jogoSel=shiftJogo(S.jogoSel,1); S.sorteio=null; render(); return; }
  if(act==="do-sorteio"){ var n=parseInt(val("so_n"),10)||2, modo=val("so_modo"), pl=poolFor(S.jogoSel); var res=(modo==="eq")?drawBalanced(pl,n):drawTematico(pl, modo==="supt"?"supt":"area"); res.key=S.jogoSel; res.modo=modo; S.sorteio=res; render(); return; }
  if(act==="gol-inc"){ setGols(S.jogoSel,id,getGols(S.jogoSel,id)+1); render(); return; }
  if(act==="gol-dec"){ setGols(S.jogoSel,id,getGols(S.jogoSel,id)-1); render(); return; }
  if(act==="share-sorteio"){ if(!S.sorteio||S.sorteio.erro){ toast("Sorteie os times primeiro"); return; } var txt=sorteioTexto(S.sorteio); if(navigator.share){ navigator.share({text:txt}).catch(function(){ shareModal(txt); }); } else { shareModal(txt); } return; }
  if(act==="copy-share"){ var ta=document.getElementById("shareTxt"); if(ta&&navigator.clipboard){ navigator.clipboard.writeText(ta.value); } else if(ta){ ta.select(); try{document.execCommand("copy");}catch(e){} } toast("Times copiados"); closeModal(); return; }
  if(act==="set-aval"){ setAval(me().id, el.getAttribute("data-alvo"), parseInt(el.getAttribute("data-val"),10)); toast("Avaliação registrada"); render(); return; }
  if(act==="clear-aval"){ setAval(me().id, el.getAttribute("data-alvo"), 0); toast("Avaliação removida"); render(); return; }
  if(act==="pres-on"){ var jo=dbJogo(S.jogoSel); setPresenca(id,S.jogoSel, jo.presenca[id]===true?null:true); render(); return; }
  if(act==="pres-off"){ var jf=dbJogo(S.jogoSel); setPresenca(id,S.jogoSel, jf.presenca[id]===false?null:false); render(); return; }
  if(act==="av-fill"){ var da=null; for(var ai=0;ai<demoAvulsos.length;ai++){ if(demoAvulsos[ai].id===id) da=demoAvulsos[ai]; } if(da){ var gg=function(x){return document.getElementById(x);}; if(gg("av_nome"))gg("av_nome").value=da.nome; if(gg("av_princ"))gg("av_princ").value=da.posPrincipal; if(gg("av_sec"))gg("av_sec").value=da.posSecundaria||""; if(gg("av_nota"))gg("av_nota").value=String(da.nota||3); if(gg("av_valor"))gg("av_valor").focus(); } return; }
  if(act==="add-avulso"){ var anome=val("av_nome").trim(); if(!anome){ toast("Informe o nome"); return; } var ao={nome:anome,posPrincipal:val("av_princ"),posSecundaria:val("av_sec")||null,nota:parseInt(val("av_nota"),10)||3,valor:parseBRNum(val("av_valor")),pago:(document.getElementById("av_pago")||{}).checked||false}; addAvulsoToJogo(S.jogoSel,ao); dbAddAvulsoLista({nome:ao.nome,posPrincipal:ao.posPrincipal,posSecundaria:ao.posSecundaria,nota:ao.nota}); toast("Avulso adicionado"); render(); return; }
  if(act==="av-pago"){ var aa=findJogoAvulso(S.jogoSel,id); if(aa){ aa.pago=!aa.pago; if(FB) jogoArrWrite(S.jogoSel); toast(aa.pago?"Diária recebida — entrou no caixa":"Marcado em aberto"); render(); } return; }
  if(act==="av-del"){ confirmModal("Remover avulso","Tirar este avulso do jogo?",function(){ delAvulsoFromJogo(S.jogoSel,id); closeModal(); toast("Avulso removido"); render(); },true); return; }

  // Áreas & supts
  if(act==="seed-listas"){ var ar=["Cartões","Itaú Shop","Parcerias","iCarros","TAG","Outras"], su=["João Seixas","Rafa Tavolaro","Tarcísio","Thomaz","Outro"]; for(var i=0;i<ar.length;i++) dbAddArea(ar[i],"aprovado"); for(var si=0;si<su.length;si++) dbAddSupt(su[si],"aprovado"); toast("Listas criadas"); render(); return; }
  if(act==="area-add"||act==="supt-add"){ var kind=act==="area-add"?"area":"supt"; var nm2=val(kind+"_add").trim(); if(!nm2){ toast("Informe um nome"); return; } if(kind==="area") dbAddArea(nm2,"aprovado"); else dbAddSupt(nm2,"aprovado"); toast("Adicionado"); render(); return; }
  if(act==="area-approve"){ dbUpdItem(demoAreas,id,{status:"aprovado"}); if(FB) db.collection("areas").doc(id).update({status:"aprovado"}).catch(fbCatch()); toast("Área aprovada"); render(); return; }
  if(act==="supt-approve"){ dbUpdItem(demoSupts,id,{status:"aprovado"}); if(FB) db.collection("supts").doc(id).update({status:"aprovado"}).catch(fbCatch()); toast("Supt aprovado"); render(); return; }
  if(act==="area-edit"){ var it=null,L=demoAreas; for(var i=0;i<L.length;i++){if(L[i].id===id)it=L[i];} promptModal("Editar área", it?it.nome:"", function(nv){ nv=(nv||"").trim(); if(nv){ dbUpdItem(demoAreas,id,{nome:nv,status:"aprovado"}); if(FB) db.collection("areas").doc(id).update({nome:nv,status:"aprovado"}).catch(fbCatch()); } closeModal(); toast("Área atualizada"); render(); }); return; }
  if(act==="supt-edit"){ var it2=null,L2=demoSupts; for(var j=0;j<L2.length;j++){if(L2[j].id===id)it2=L2[j];} promptModal("Editar supt", it2?it2.nome:"", function(nv){ nv=(nv||"").trim(); if(nv){ dbUpdItem(demoSupts,id,{nome:nv,status:"aprovado"}); if(FB) db.collection("supts").doc(id).update({nome:nv,status:"aprovado"}).catch(fbCatch()); } closeModal(); toast("Supt atualizado"); render(); }); return; }
  if(act==="area-del"){ confirmModal("Excluir área","Remover esta área da lista?",function(){ dbDelItem(demoAreas,id); if(FB) db.collection("areas").doc(id).delete().catch(fbCatch()); closeModal(); toast("Área removida"); render(); },true); return; }
  if(act==="supt-del"){ confirmModal("Excluir supt","Remover este supt da lista?",function(){ dbDelItem(demoSupts,id); if(FB) db.collection("supts").doc(id).delete().catch(fbCatch()); closeModal(); toast("Supt removido"); render(); },true); return; }

  if(act==="reset-link"){ var rp=dbGet(id); if(FB){ if(rp) auth.sendPasswordResetEmail(rp.email).then(function(){ toast("Link enviado para "+rp.email); }).catch(function(){ toast("Não consegui enviar o link"); }); return; } toast((DEMO?"(demo) ":"")+"Link de redefinição enviado para "+(rp?rp.email:"")); return; }
  if(act==="copy-acesso"){ var cp=dbGet(id); if(navigator.clipboard) navigator.clipboard.writeText("Login: "+cp.email+"\nSenha: "+cp.senha); toast("Acesso copiado"); return; }

  if(act==="prompt-save"){ if(window.__promptSave){ var ipt=document.getElementById("promptInput"); window.__promptSave(ipt?ipt.value:""); } return; }
  if(act==="modal-close"){ if(!ev.target.getAttribute("data-stop")) closeModal(); return; }
  if(act==="modal-yes"){ if(window.__modalYes) window.__modalYes(); return; }
});

document.addEventListener("change", function(ev){
  var t=ev.target; if(!t) return;
  if(t.id==="fotoInput"){ var f=t.files&&t.files[0]; if(f) processFoto(f); t.value=""; return; }
  var act=t.getAttribute("data-action");
  if(act==="area-select"||act==="supt-select"){ syncActiveForm(); var tg=formTarget(); var kind=act==="area-select"?"area":"supt"; var v=t.value; if(v==="__new__"){ tg[kind+"New"]=true; tg[kind]=""; } else { tg[kind+"New"]=false; tg[kind]=v; } render(); return; }
});
document.addEventListener("keydown", function(ev){ if(ev.key!=="Enter") return; if(S.view==="auth"){ if(S.googleNew) return; if(S.forgot) doForgot(); else if(S.authTab==="login") doLogin(); } });

function setFavicon(){ if(document.getElementById("dynfav")) return; var l=document.createElement("link"); l.id="dynfav"; l.rel="icon"; l.type="image/svg+xml"; l.href="data:image/svg+xml,"+encodeURIComponent(crest("crest")); document.head.appendChild(l); }

function seedDemo(){ if(!DEMO) return; var m=todayKey(), pm=shiftMonth(m,-1);
  demoMensalidades["u_master|"+m]={pago:true,data:todayBR(),valor:50};
  demoMensalidades["u_bruno|"+m]={pago:true,data:todayBR(),valor:50};
  demoMensalidades["u_diego|"+m]={pago:true,data:todayBR(),valor:50};
  demoMensalidades["u_master|"+pm]={pago:true,data:"05/"+pm.slice(5,7),valor:50};
  demoMensalidades["u_adm|"+pm]={pago:true,data:"07/"+pm.slice(5,7),valor:50};
  demoMensalidades["u_bruno|"+pm]={pago:true,data:"03/"+pm.slice(5,7),valor:50};
  demoMensalidades["u_diego|"+pm]={pago:true,data:"10/"+pm.slice(5,7),valor:50};
  demoMensalidades["u_lucas|"+pm]={pago:true,data:"09/"+pm.slice(5,7),valor:50};
  dbAddDespesa({mesKey:m,dataBR:todayBR(),categoria:"quadra",valor:200,descricao:"Aluguel da quadra"});
  dbAddDespesa({mesKey:m,dataBR:todayBR(),categoria:"materiais",valor:80,descricao:"Bolas novas"});
  dbAddDespesa({mesKey:pm,dataBR:"06/"+pm.slice(5,7),categoria:"quadra",valor:200,descricao:"Aluguel da quadra"});
  var pj=proximoJogoKey(), j=dbJogo(pj);
  j.confirm={u_master:"sim",u_bruno:"sim",u_diego:"sim",u_lucas:"nao"};
  j.avulsos=[{id:"ja_s1",nome:"Fábio Nunes",posPrincipal:"ataque",posSecundaria:null,nota:3,valor:0,pago:false}];
  var past=shiftJogo(pj,-1), jpast=dbJogo(past);
  jpast.confirm={u_master:"sim",u_bruno:"sim",u_diego:"sim",u_adm:"nao"};
  jpast.presenca={u_master:true,u_bruno:true,u_diego:true,u_adm:false};
  jpast.avulsos=[{id:"ja_s2",nome:"Zé Carlos",posPrincipal:"zaga",posSecundaria:"meio",nota:3,valor:20,pago:true}];
  jpast.gols={u_bruno:2,u_master:1,ja_s2:1};
  jpast.encerrado=true;
  // Avaliações de pares (anônimas): Bruninho e Paredão já têm 3+ avaliações
  setAval("u_master","u_bruno",5); setAval("u_diego","u_bruno",5); setAval("u_lucas","u_bruno",4); setAval("u_adm","u_bruno",5);
  setAval("u_master","u_diego",3); setAval("u_bruno","u_diego",3); setAval("u_lucas","u_diego",4);
  setAval("u_adm","u_master",4); setAval("u_bruno","u_master",4); // 2 pares -> ainda só autoavaliação
  setAval("u_master","u_adm",4); // 1 par
}
if(FB){ subscribePublic(); auth.onAuthStateChanged(fbAfterAuth); render(); }
else { if(DEMO) seedDemo(); render(); }
</script>
