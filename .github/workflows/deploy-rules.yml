name: Publicar regras do Firestore

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-rules.yml
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Autenticar no Google
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$SA_JSON" || { echo "Secret FIREBASE_SERVICE_ACCOUNT nao configurado"; exit 1; }
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          python3 - <<'PY'
          import json, os, sys
          f = os.path.join(os.environ["RUNNER_TEMP"], "sa.json")
          try:
              d = json.load(open(f))
              print("::notice title=Chave lida::type=%s email=%s project=%s tem_private_key=%s" % (d.get("type"), d.get("client_email"), d.get("project_id"), bool(d.get("private_key"))))
          except Exception as e:
              print("::error title=Secret invalido::nao e um JSON valido (%s). Cole o conteudo INTEIRO do arquivo, de { ate }." % type(e).__name__)
              sys.exit(1)
          PY
      - name: Diagnostico de permissoes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        continue-on-error: true
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null 2>&1
          TOKEN=$(gcloud auth print-access-token 2>/dev/null)
          R=$(curl -s -X POST "https://cloudresourcemanager.googleapis.com/v1/projects/fute-da-firma:testIamPermissions" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"permissions":["firebaserules.rulesets.test","firebaserules.rulesets.create","firebaserules.releases.update","firebaserules.releases.create","datastore.databases.getMetadata"]}')
          echo "::notice title=Permissoes concedidas::$(echo "$R" | tr '\n' ' ' | cut -c1-600)"
          R2=$(curl -s -X POST "https://firebaserules.googleapis.com/v1/projects/fute-da-firma:test" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"source":{"files":[{"name":"firestore.rules","content":"rules_version = \"2\"; service cloud.firestore { match /databases/{d}/documents { match /{x=**} { allow read: if false; } } }"}]}}')
          echo "::notice title=Resposta da API de regras::$(echo "$R2" | tr '\n' ' ' | cut -c1-700)"
      - name: Publicar firestore.rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set +e
          npx -y firebase-tools@13 deploy --only firestore:rules --project fute-da-firma --non-interactive > "$RUNNER_TEMP/deploy.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/deploy.log"
          if [ $code -ne 0 ]; then
            echo "::error title=Falha ao publicar regras::$(grep -v -e '^$' -e 'npm warn' "$RUNNER_TEMP/deploy.log" | tail -n 12 | tr '\n' ' ' | cut -c1-900)"
          fi
          exit $code
